name: MiniScape validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: miniscape_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: PostgreSQL transaction integration
        run: node --test test/postgres-trade.test.js
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/miniscape_test
      - run: npm test
      - run: node --check server.js
      - run: node --check public/client.js
