<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniScape MMO</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #1e1e1e; color: #ffff00; font-family: monospace; display: flex; justify-content: center; align-items: center; user-select: none; }
    #game-container { display: flex; border: 4px solid #5a5245; background: #3e3529; max-width: 100%; }
    canvas { background: #4b692f; cursor: crosshair; width: min(800px, 100%); height: auto; display: block; touch-action: manipulation; }
    #sidebar { width: 220px; flex-shrink: 0; padding: 12px; display: flex; flex-direction: column; gap: 15px; border-left: 4px solid #5a5245; }
    .panel { background: #2c251d; padding: 10px; border: 2px solid #5a5245; }
    h3 { margin: 0 0 8px; color: #ff981f; font-size: 14px; text-transform: uppercase; }
    .skill-row { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 4px; font-size: 12px; }
    button { width: 100%; padding: 8px; margin-bottom: 5px; background: #5a5245; color: white; border: 2px solid #3e3529; cursor: pointer; font-family: monospace; font-weight: bold; }
    button.active { background: #8b261d; border-color: #ff981f; }
    button:focus-visible { outline: 2px solid #ffff00; outline-offset: 2px; }
    .hint { font-size: 11px; color: #ccc; line-height: 1.5; }
    #connection { font-size: 11px; color: #b4e6af; }
    @media (max-width: 1050px) {
      body { align-items: flex-start; }
      #game-container { flex-direction: column; width: min(100%, 800px); }
      #sidebar { width: 100%; border-left: 0; border-top: 4px solid #5a5245; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    }
  </style>
</head>
<body>
  <main id="game-container">
    <canvas id="gameCanvas" width="800" height="600" aria-label="MiniScape herný svet"></canvas>
    <aside id="sidebar">
      <section class="panel">
        <h3>Bojový štýl (XP)</h3>
        <button id="btn-attack" class="active" type="button">Meč: Attack (Presnosť)</button>
        <button id="btn-strength" type="button">Meč: Strength (Sila)</button>
        <button id="btn-ranging" type="button">Luk: Ranging (Diaľka)</button>
      </section>
      <section class="panel"><h3>Skilly</h3><div id="skills-list"></div></section>
      <section class="panel hint">
        <div id="connection" role="status">Pripájam sa…</div>
        <p>• Klikni na zem pre pohyb.<br>• Klikni na červeného Goblina pre útok.<br>• Hra beží na 600 ms tickoch ako klasické RS.</p>
        <p>• Skilly sa zatiaľ ukladajú iba počas pripojenia. Databázu doplníme neskôr.</p>
      </section>
    </aside>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
